name = "xdsolucoesfinanceira"
main = "./worker/index.ts"
compatibility_date = "2026-09-08"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
[observability.logs]
enabled = false
invocation_logs = true


[secrets]
required = ["API_FORMULARIO"]
